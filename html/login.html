<body>
    <main class="container">
        <section class="card auth-card">
            <div class="tabs">
                <a class="tab active" href="login.html">Login</a>
                <a class="tab " href="register.html">Register</a>
            </div>

            <form class="form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="btn">Login</button>
            </form>

            <p class="or">Or continue with</p>
            <div class="socials">
                <button type="button" class="social" title="Google">G</button>
                <button type="button" class="social" title="Facebook">f</button>
                <button type="button" class="social" title="Twitter">t</button>
            </div>
        </section>
    </main>
